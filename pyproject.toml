[project]
name = "synckey"
version = "0.1.0"
description = "One API key for every AI provider. Automatic failover, tier-based fallback, and zero rate-limit headaches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "synckey", email = "synckey@example.com" }]
keywords = ["llm", "gateway", "openai", "groq", "gemini", "cerebras", "cohere", "nvidia", "proxy", "api-key", "ai", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
synckey = "synckey.cli:app"

[project.urls]
Homepage = "https://github.com/pmdnawaz1/synckey"
Documentation = "https://github.com/pmdnawaz1/synckey#readme"
Repository = "https://github.com/pmdnawaz1/synckey"
Issues = "https://github.com/pmdnawaz1/synckey/issues"
Changelog = "https://github.com/pmdnawaz1/synckey/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synckey"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
