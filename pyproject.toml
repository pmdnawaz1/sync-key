[project]
name = "synckey"
version = "0.1.0"
description = "Merge every AI provider key behind one unified, OpenAI-compatible API key. Round-robin, rate-limit eating, token monitoring, provider auto-detection — all from the CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "synckey" }]
keywords = ["llm", "gateway", "openai", "groq", "gemini", "cerebras", "cohere", "nvidia", "proxy", "api-key"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
synckey = "synckey.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synckey"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
